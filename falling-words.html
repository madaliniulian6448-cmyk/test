<!doctype html><html lang="ro"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Falling Words</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080e13;color:#d9f5ff;font:15px Arial,sans-serif;display:flex;justify-content:center;align-items:center;background-image:linear-gradient(#15222a55 1px,transparent 1px),linear-gradient(90deg,#15222a55 1px,transparent 1px);background-size:40px 40px}main{width:min(760px,95vw);padding:32px;background:#0b141be8;border:1px solid #25414a;box-shadow:0 0 55px #0009;border-radius:10px}h1{font-size:24px;letter-spacing:5px;color:#38bdf8}button{cursor:pointer;background:#10222c;border:1px solid #38bdf8;color:#a8eaff;padding:12px 18px;border-radius:5px}button:hover{background:#17465b}a{color:#90e9f9;text-decoration:none}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px}#status{color:#b3ff4d}input{background:#060b10;border:1px solid #38bdf8;color:white;padding:14px;font:20px monospace;width:100%;outline:none}small{color:#7295a1}</style><main><div class="bar"><a href="./">← ÎNAPOI</a><small>HACK TRAINER / 02</small></div><h1>CUVINTE ÎN CĂDERE</h1><div class="bar"><span>SCOR: <b id="score">0</b> | BEST: <b id="best">0</b></span><span id="clock">01:00</span></div><div id="area" style="height:420px;position:relative;overflow:hidden;border:1px solid #274653;background:#03080c;margin:20px 0;background-image:linear-gradient(#17303b55 1px,transparent 1px),linear-gradient(90deg,#17303b55 1px,transparent 1px);background-size:40px 40px"></div><input id="type" placeholder="Scrie cuvântul și apasă ENTER" autocomplete="off" disabled><p id="status">Tastează cuvintele înainte să ajungă jos.</p><button id="start">START</button></main><script>const pool='firewall server acces sistem parola retea virus proxy criptat socket pachet kernel buffer exploit scanat bypass semnal codec router antena portal token cipher hash logare backup daemon patch script inject admin guest debug trace agent nod flux date bloc raid sync intrare iesire sector registru memorie proces thread stack vector delta omega sigma alpha bravo echo tango'.split(' ');let active=false,items=[],score=0,left=60,spawn=0,last=0,raf=0;const area=document.querySelector('#area'),type=document.querySelector('#type'),status=document.querySelector('#status');best.textContent=localStorage.getItem('fw_hs')||0;function end(ok){active=false;type.disabled=true;cancelAnimationFrame(raf);status.textContent=ok?'ACCES ACORDAT — TIMP COMPLET':'ACCES RESPINS — CUVÂNT PIERDUT';start.textContent='REÎNCEARCĂ';if(score>Number(localStorage.getItem('fw_hs')||0)){localStorage.setItem('fw_hs',score);best.textContent=score}}function add(){let el=document.createElement('span'),word=pool[Math.random()*pool.length|0];el.textContent=word;el.style.cssText='position:absolute;top:0;color:#38bdf8;font:bold 20px monospace;text-shadow:0 0 10px #38bdf8';el.style.left=(Math.random()*Math.max(0,area.clientWidth-140))+'px';area.append(el);items.push({word,el,y:0,speed:55+Math.random()*65})}function loop(now){if(!active)return;let dt=Math.min(.05,(now-last)/1000);last=now;left-=dt;spawn+=dt;clock.textContent='00:'+String(Math.max(0,Math.ceil(left))).padStart(2,'0');if(left<=0){end(true);return}if(spawn>Math.max(.45,1.65-score*.02)){spawn=0;add()}for(const o of items){o.y+=o.speed*dt;o.el.style.top=o.y+'px';if(o.y>area.clientHeight-30){end(false);return}}raf=requestAnimationFrame(loop)}start.onclick=()=>{active=true;score=0;left=60;spawn=0;items=[];area.replaceChildren();document.querySelector('#score').textContent='0';type.disabled=false;type.value='';type.focus();status.textContent='ELIMINĂ TOATE CUVINTELE';start.textContent='RESTART';last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)};type.addEventListener('keydown',e=>{if(e.key!=='Enter'||!active)return;const idx=items.findIndex(o=>o.word===type.value.trim().toLowerCase());if(idx>=0){items[idx].el.remove();items.splice(idx,1);score+=10;document.querySelector('#score').textContent=score}type.value=''});</script></html>
