<!doctype html><html lang="ro"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sequence Memory</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080e13;color:#d9f5ff;font:15px Arial,sans-serif;display:flex;justify-content:center;align-items:center;background-image:linear-gradient(#15222a55 1px,transparent 1px),linear-gradient(90deg,#15222a55 1px,transparent 1px);background-size:40px 40px}main{width:min(760px,95vw);padding:32px;background:#0b141be8;border:1px solid #25414a;box-shadow:0 0 55px #0009;border-radius:10px}h1{font-size:24px;letter-spacing:5px;color:#38bdf8}button{cursor:pointer;background:#10222c;border:1px solid #38bdf8;color:#a8eaff;padding:12px 18px;border-radius:5px}button:hover{background:#17465b}a{color:#90e9f9;text-decoration:none}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px}#status{color:#b3ff4d}input{background:#060b10;border:1px solid #38bdf8;color:white;padding:14px;font:20px monospace;width:100%;outline:none}small{color:#7295a1}</style><main><div class="bar"><a href="./">← ÎNAPOI</a><small>HACK TRAINER / 03</small></div><h1>SEQUENCE MEMORY</h1><div class="bar"><span>RUNDA: <b id="round">1</b> / 8</span><span id="status">MEMOREAZĂ SECVENȚA</span></div><div id="grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:480px;margin:32px auto"></div><div style="text-align:center"><button id="start">START HACK</button><p><small>Memorează ordinea în care se aprind pătratele și repet-o.</small></p></div></main><style>.tile{aspect-ratio:1;background:#10232b;border:1px solid #28505e;border-radius:7px;transition:background .1s,box-shadow .1s}.tile.lit{background:#dfff3d;box-shadow:0 0 25px #caff3d}.tile.bad{background:#e94455;box-shadow:0 0 22px #f44}</style><script>const grid=document.querySelector('#grid'),status=document.querySelector('#status'),round=document.querySelector('#round');let sequence=[],position=0,phase='idle',generation=0;const tiles=Array.from({length:16},(_,i)=>{let el=document.createElement('button');el.className='tile';el.onclick=()=>tap(i);grid.append(el);return el});const sleep=ms=>new Promise(r=>setTimeout(r,ms));async function show(){let gen=++generation;phase='show';status.textContent='PRIVEȘTE SECVENȚA';await sleep(500);for(const n of sequence){if(gen!==generation)return;tiles[n].classList.add('lit');await sleep(600);tiles[n].classList.remove('lit');await sleep(160)}if(gen!==generation)return;position=0;phase='input';status.textContent='REPETĂ SECVENȚA'}function tap(n){if(phase!=='input')return;tiles[n].classList.add('lit');setTimeout(()=>tiles[n].classList.remove('lit'),180);if(n!==sequence[position]){phase='fail';tiles[n].classList.add('bad');status.textContent='ACCES RESPINS';start.textContent='REÎNCEARCĂ';return}position++;if(position===sequence.length){phase='success';if(sequence.length===8){status.textContent='ACCES ACORDAT';start.textContent='JOACĂ DIN NOU'}else{status.textContent='RUNDA COMPLETĂ';setTimeout(()=>{sequence.push(Math.random()*16|0);round.textContent=sequence.length;show()},650)}}}start.onclick=()=>{generation++;tiles.forEach(t=>t.className='tile');sequence=[Math.random()*16|0];round.textContent='1';start.textContent='RESTART';show()};</script></html>
