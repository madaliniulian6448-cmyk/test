<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HACK AMPRENTĂ</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171a19;color:#fff;font-family:Arial,sans-serif}body{display:grid;place-items:center;background:radial-gradient(circle,#555f59,#1a1d1c 72%)}#w{position:relative;width:min(728px,95vw);aspect-ratio:728/556;background:#0c0f0eee;border:1px solid #38403d;border-radius:5px;box-shadow:0 20px 60px #000b}#w:before,#w:after{content:"";position:absolute;left:16%;width:68%;height:2px;background:linear-gradient(90deg,#59e5d6,#ddf23e)}#w:before{top:0}#w:after{bottom:0}header{height:116px;border-bottom:1px solid #343b38;position:relative}.tm{position:absolute;left:34px;top:26px;color:#73e2d1;font:bold 36px monospace}.bar{width:110px;height:4px;background:#343b38;margin-top:4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ddf33d,#65e0d0)}.rd{font:9px Arial;margin-top:7px;color:#d6dcd9}.ttl{text-align:center;padding-top:43px;font-weight:900;font-size:20px}.sub{text-align:center;color:#c9cecc;font-size:9px;margin-top:6px}.st{position:absolute;right:34px;top:40px;border:1px solid #d9e74a;border-radius:5px;padding:6px 10px;color:#e0eb4c;font-size:8px;font-weight:bold}.st:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#e7f34a;margin-right:7px}.tr{position:absolute;right:35px;top:75px;font-size:8px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#6ce3d2;box-shadow:0 0 7px #6ce3d2;margin-left:4px}.dot.off{background:#713c38;box-shadow:none}.game{position:absolute;left:32px;right:32px;top:132px;height:360px;border:1px solid #58615c;border-radius:8px;background-color:#070909;background-image:linear-gradient(#1a2420 1px,transparent 1px),linear-gradient(90deg,#1a2420 1px,transparent 1px);background-size:24px 24px;overflow:hidden}.scan{position:absolute;left:132px;right:132px;inset-block:0;overflow:hidden}.row{position:absolute;left:0;right:0;height:45px;overflow:hidden;border-bottom:1px solid #606963}.belt{position:absolute;inset:0;transition:transform 85ms ease-out}.fp{position:absolute;width:432px;height:360px;color:#dceb45;filter:drop-shadow(0 0 2px #dceb45)}button{position:absolute;width:25px;height:25px;background:#111;border:1px solid #d8e75a;color:#f2f47a;border-radius:5px;font-size:18px;cursor:pointer;z-index:5}button:hover{background:#61722f}.l{left:10px}.r{right:10px}footer{position:absolute;bottom:15px;left:0;right:0;text-align:center;font-size:10px;font-weight:bold}kbd{border:1px solid #eee;border-radius:5px;padding:5px 12px;margin:0 8px}.msg{display:none;position:absolute;inset:0;z-index:20;background:#000d;place-items:center;text-align:center;font-size:26px;font-weight:900}.msg small{display:block;font-size:11px;margin-top:10px;color:#bbc5c0}.hint{position:fixed;bottom:10px;color:#89938e;font-size:10px}</style></head><body><div id="w"><header><div class="tm"><span id="time">01:30</span><div class="bar"><i id="p"></i></div><div class="rd">RUNDA <span id="rn">1</span> DIN 3</div></div><div class="ttl">HACK AMPRENTĂ</div><div class="sub">Aliniază părțile pentru a reconstrui amprenta</div><div class="st">SCANARE ÎN CURS</div><div class="tr">ÎNCERCĂRI <span id="dots"></span></div></header><div class="game" id="g"><div class="scan" id="scan"></div></div><footer>APASĂ <kbd>ENTER</kbd> CÂND AI ALINIAT AMPRENTA</footer><div class="msg" id="msg"></div></div><div class="hint">ENTER = verificare • R = restart</div>
<script>
const paths=["M52 231C41 144 89 62 174 34C260 6 344 52 365 137C380 201 353 266 300 303","M70 238C58 161 99 88 178 58C253 30 326 70 347 145C364 204 338 256 292 287","M88 244C77 177 110 113 180 81C244 52 307 85 328 152C345 205 322 247 283 271","M106 250C96 193 121 137 183 105C236 77 289 102 309 158C326 205 305 238 275 255","M124 255C116 208 134 161 185 128C227 101 270 119 290 165C306 203 289 230 267 239","M143 257C137 221 148 184 188 151C219 126 252 137 271 171C285 199 272 220 259 223","M163 252C159 229 163 207 191 174C211 151 233 156 251 178C261 195 254 207 250 208","M184 238C181 226 182 217 194 197C204 181 215 180 227 190C236 199 234 207 229 213","M48 184C46 247 75 298 125 327","M58 116C31 170 33 229 58 275","M87 68C44 109 25 168 35 220","M130 38C78 62 46 102 32 151","M221 25C288 29 341 69 363 124","M270 38C328 56 366 99 375 154","M311 62C355 91 378 135 377 181","M79 263C99 303 134 328 176 336","M101 250C120 289 151 312 190 320","M126 239C142 275 169 296 203 304","M151 228C165 260 187 281 215 288","M328 224C315 267 286 301 247 321"];
const N=8,POS=9,STEP=1,LIMIT=90;let off=[],round=1,tries=3,left=LIMIT,timer=null,deadline=0,transitioning=false;
const scan=document.getElementById("scan"),g=document.getElementById("g"),msg=document.getElementById("msg");
function svg(x,i){const art='<g fill="none" stroke="currentColor" stroke-width="2.35" stroke-linecap="round" stroke-linejoin="round">'+paths.map(p=>'<path d="'+p+'"/>').join("")+'</g>';return '<div class="belt" style="transform:translateX('+x+'px)"><svg class="fp" viewBox="0 0 432 360" style="transform:translate(0px,'+(-i*45)+'px)">'+art+'</svg></div>'}
function random(){off=Array.from({length:N},()=>{const choices=[-192,-144,-96,-48,48,96,144,192];return choices[Math.floor(Math.random()*choices.length)]});}
function dots(){document.getElementById("dots").innerHTML=[0,1,2].map(i=>'<i class="dot '+(i<tries?"":"off")+'"></i>').join("")}
function draw(){scan.innerHTML="";g.querySelectorAll("button").forEach(x=>x.remove());for(let i=0;i<N;i++){let row=document.createElement("div");row.className="row";row.style.top=i*45+"px";row.innerHTML=svg(off[i]*STEP,i);scan.appendChild(row);for(const [c,d,s] of [["l",-1,"‹"],["r",1,"›"]]){let b=document.createElement("button");b.className=c;b.style.top=i*45+10+"px";b.textContent=s;b.onclick=()=>shift(i,d);g.appendChild(b)}}dots();document.getElementById("rn").textContent=round}
function shift(i,d){
 const row=scan.children[i], belt=row.querySelector(".belt");
 const W=row.clientWidth||476;
 const start=off[i];

 // LEFT button (d=-1): current strip exits LEFT.
 // RIGHT button (d=+1): current strip exits RIGHT.
 belt.style.transition="transform 75ms linear";
 belt.style.transform="translateX("+(start + d*W)+"px)";

 setTimeout(()=>{
   // The new alignment state advances in the SAME visual direction.
   off[i]+=d*48;
   if(off[i]>216) off[i]-=432;
   if(off[i]<-216) off[i]+=432;

   // Spawn the same strip fully OUTSIDE on the OPPOSITE side,
   // then slide it into its new offset.
   const spawn = off[i] - d*W;
   row.innerHTML=svg(spawn,i);
   const nb=row.querySelector(".belt");
   nb.style.transition="none";
   void nb.offsetWidth;
   requestAnimationFrame(()=>{
     nb.style.transition="transform 75ms linear";
     nb.style.transform="translateX("+off[i]+"px)";
   });
 },78);
}
function syncTime(){left=Math.max(0,Math.ceil((deadline-Date.now())/1000))}
function renderTime(){document.getElementById("time").textContent=String(Math.floor(Math.max(0,left)/60)).padStart(2,"0")+":"+String(Math.max(0,left)%60).padStart(2,"0");document.getElementById("p").style.width=(left/LIMIT*100)+"%"}
function nextRound(){random();draw();syncTime();renderTime();transitioning=false}
function startSession(){if(timer){clearInterval(timer);timer=null}deadline=Date.now()+LIMIT*1000;syncTime();renderTime();nextRound();timer=setInterval(()=>{syncTime();renderTime();if(left<=0)end("TIMP EXPIRAT")},200)}
function flash(t){msg.style.display="grid";msg.innerHTML="<div>"+t+"</div>";setTimeout(()=>msg.style.display="none",450)}
function check(){if(transitioning)return;if(off.every(x=>Math.abs(x)<=12)){if(round===3)end("ACCES ACORDAT");else{transitioning=true;round++;flash("RUNDA COMPLETĂ");setTimeout(nextRound,550)}}else{tries--;dots();if(tries<=0)end("ACCES RESPINS");else flash("AMPRENTĂ INCORECTĂ")}}
function end(t){clearInterval(timer);timer=null;msg.style.display="grid";msg.innerHTML="<div>"+t+"<small>Apasă R pentru un antrenament nou</small></div>"}
function reset(){round=1;tries=3;transitioning=false;msg.style.display="none";startSession()}document.addEventListener("keydown",e=>{if(e.key==="Enter")check();if(e.key.toLowerCase()==="r")reset()});startSession();
</script></body></html>
